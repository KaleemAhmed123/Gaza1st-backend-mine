# ==============================================================================
# IMPORTANT DEPLOYMENT INSTRUCTIONS
# ==============================================================================
# This docker-compose.yml is stored in the Backend repository for safekeeping, 
# but it is designed to orchestrate BOTH the frontend and backend.
#
# HOW TO USE THIS ON THE VPS:
# 1. Create a common folder on your VPS: `mkdir gaza40_app && cd gaza40_app`
# 2. Clone BOTH repositories into this folder side-by-side.
#    The folder names matter: the build contexts below point at them.
#    - `git clone <backend-repo-url> backend`
#    - `git clone <frontend-repo-url> frontend`
# 3. COPY this file from the backend repo UP into the common folder:
#    - `cp backend/docker-compose.yml .`
# 4. Create your `.env` files inside both repo folders.
# 5. Run `docker compose up -d --build` from the common folder!
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gaza40-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Keep V8 heap under the 1g memory limit below (else OOM-kill mid-GC)
      - NODE_OPTIONS=--max-old-space-size=768
    ports:
      - "8000:8000" # Change 8000 to your backend port if different
    networks:
      - gaza40_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gaza40-frontend
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      # This points to the internal Docker network name 'backend'
      - BACKEND_API_URL=http://backend:8000
      # Keep V8 heap under the 1g memory limit below (else OOM-kill mid-GC)
      - NODE_OPTIONS=--max-old-space-size=768
    ports:
      - "3000:3000"
    networks:
      - gaza40_network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

networks:
  gaza40_network:
    driver: bridge
